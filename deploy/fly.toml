# Paperclip en Fly.io, desde la imagen publicada.
#
# No se construye nada: `ghcr.io/paperclipai/paperclip:latest` ya trae el
# servidor, el PostgreSQL embebido y los CLI de los adapters locales
# (claude, codex, opencode, gemini) preinstalados.
#
# Uso:
#   fly launch --no-deploy --copy-config --config deploy/fly.toml
#   fly volumes create paperclip_data --size 3 --region eze
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   fly deploy --config deploy/fly.toml
#   fly secrets set PAPERCLIP_API_URL=https://<app>.fly.dev/api
#
# El último paso va después del primer deploy, cuando ya se conoce el hostname.

app = "opfarma-paperclip"
# No hay región en Buenos Aires: `eze` no existe en el catálogo de Fly.
# Sao Paulo es la más cercana con soporte de volúmenes.
primary_region = "gru"

[build]
  image = "ghcr.io/paperclipai/paperclip:latest"

[env]
  PORT = "3100"

  # Todo el estado vive acá: base embebida, archivos, clave de secretos.
  # Tiene que coincidir con el destino del volumen o se pierde en cada deploy.
  PAPERCLIP_HOME = "/paperclip"

  # Escuchar en todas las interfaces. Sin esto el contenedor sólo responde
  # en loopback y Fly no lo puede enrutar.
  PAPERCLIP_BIND = "custom"
  PAPERCLIP_BIND_HOST = "0.0.0.0"

  # Expuesto a internet: exige login y chequeos más estrictos.
  PAPERCLIP_DEPLOYMENT_MODE = "authenticated"
  PAPERCLIP_DEPLOYMENT_EXPOSURE = "public"

[http_service]
  internal_port = 3100
  force_https = true

  # El servidor es con estado: tiene base de datos corriendo adentro y una
  # cola de heartbeats. No se lo puede apagar entre requests.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "paperclip_data"
  destination = "/paperclip"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
